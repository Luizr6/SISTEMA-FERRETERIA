# =====================================================================
#  ferreteria-reportes-ms  -  Reportes gerenciales y auditoría
#  Todo valor sensible se puede sobreescribir con variables de entorno.
# =====================================================================
spring.application.name=ferreteria-reportes-ms
server.port=${PORT:8081}

# --- Base de datos: la MISMA PostgreSQL que usa Django -----------------
# Django debe correr con POSTGRES_DB=ferreteria (ver .env.example del backend).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ferreteria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

# Las tablas de Django NO se crean ni modifican desde aquí (Django es el dueño del esquema).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# La única tabla propia (ms_evento_auditoria) se crea con schema.sql si no existe.
spring.sql.init.mode=always

# --- JSON: snake_case, igual que la API de Django -----------------------
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima
spring.jackson.default-property-inclusion=non_null

# --- Seguridad ------------------------------------------------------------
# Debe ser EXACTAMENTE el mismo valor que DJANGO_SECRET_KEY del backend (SimpleJWT firma con él).
ferreteria.jwt.secret=${DJANGO_SECRET_KEY:dev-solo-local-cambiar-en-produccion-ferreteria-2026}
# Clave que usa Django (servidor a servidor) para enviar eventos de auditoría.
ferreteria.auditoria.api-key=${MS_API_KEY:clave-servicio-dev-2026}
# Intentos fallidos de login para marcar el evento como CRITICO (posible ataque de fuerza bruta)
ferreteria.auditoria.intentos-fallidos-alerta=5
ferreteria.auditoria.ventana-minutos=10

ferreteria.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173}
ferreteria.zona-horaria=America/Lima

# --- Datos del negocio para los PDF --------------------------------------
ferreteria.negocio.nombre=${FERRETERIA_NOMBRE:Ferretería El Constructor}
ferreteria.negocio.ruc=${FERRETERIA_RUC:20000000001}

# --- Documentación y monitoreo -------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
