# =====================================================================
#  ferreteria-reportes-ms  -  Facturacion, reportes, procesos programados y auditoria
#  Todo valor sensible se puede sobreescribir con variables de entorno.
# =====================================================================
spring.application.name=ferreteria-reportes-ms
server.port=${PORT:8081}

# --- Base de datos: la MISMA PostgreSQL que usa Django -----------------
# Django debe correr con POSTGRES_DB=ferreteria (ver .env.example del backend).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ferreteria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

# Las tablas de Django NO se crean ni modifican desde aqui (Django es el dueno del esquema).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# La unica tabla propia (ms_evento_auditoria) se crea con schema.sql si no existe.
spring.sql.init.mode=always

# --- JSON: snake_case, igual que la API de Django -----------------------
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima
spring.jackson.default-property-inclusion=non_null

# --- Seguridad ------------------------------------------------------------
# Debe ser EXACTAMENTE el mismo valor que DJANGO_SECRET_KEY del backend (SimpleJWT firma con el).
ferreteria.jwt.secret=${DJANGO_SECRET_KEY:dev-solo-local-cambiar-en-produccion-ferreteria-2026}
# Clave que usa Django (servidor a servidor) para enviar eventos de auditoria.
ferreteria.auditoria.api-key=${MS_API_KEY:clave-servicio-dev-2026}
# Intentos fallidos de login para marcar el evento como CRITICO (posible ataque de fuerza bruta)
ferreteria.auditoria.intentos-fallidos-alerta=5
ferreteria.auditoria.ventana-minutos=10

ferreteria.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173}
ferreteria.zona-horaria=America/Lima

# --- Datos del negocio para los PDF --------------------------------------
ferreteria.negocio.nombre=${FERRETERIA_NOMBRE:FERRETER\u00CDA C&R}
ferreteria.negocio.ruc=${FERRETERIA_RUC:20000000001}
ferreteria.negocio.direccion=${FERRETERIA_DIRECCION:Av. Principal 123}
ferreteria.negocio.telefono=${FERRETERIA_TELEFONO:999 999 999}
# Misma tasa que IGV_TASA de Django
ferreteria.igv-tasa=${IGV_TASA:0.18}

# --- Procesos programados ------------------------------------------------
# Facturacion automatica (cada minuto) y cierre del dia (23:00 hora de Lima).
ferreteria.tareas.activas=${TAREAS_ACTIVAS:true}
# Ventas de los ultimos N dias que se revisan para emitir comprobantes pendientes
ferreteria.tareas.dias-pendientes=7
ferreteria.tareas.cada-ms=60000
ferreteria.tareas.espera-inicial-ms=20000
# segundo minuto hora dia mes dia-semana
ferreteria.tareas.cierre-cron=0 0 23 * * *

# --- Documentacion y monitoreo -------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
